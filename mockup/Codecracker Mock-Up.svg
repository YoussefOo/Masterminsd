<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <style>
    text { font-family: Arial, sans-serif; fill: #212529; }
    .muted { fill: #6c757d; }
    .label { font-size: 16px; font-weight: 700; }
    .field { fill: #fff; stroke: #adb5bd; stroke-width: 2; }
    .primary { fill: #0d6efd; }
    .secondary { fill: #6c757d; }
    .button-text { fill: #fff; font-size: 17px; font-weight: 700; text-anchor: middle; }
  </style>
  <rect width="1200" height="760" fill="#f8f9fa"/>
  <rect width="1200" height="76" fill="#212529"/>
  <text x="48" y="49" fill="#fff" font-size="28" font-weight="700">Codecracker</text>

  <rect x="380" y="90" width="440" height="660" rx="12" fill="#fff" stroke="#dee2e6" stroke-width="2"/>
  <text x="600" y="185" font-size="30" font-weight="700" text-anchor="middle">Login</text>
  <text x="600" y="217" class="muted" font-size="16" text-anchor="middle">Melde dich an, um zur Lobby zu gelangen.</text>

  <text x="430" y="275" class="label">Benutzername</text>
  <rect x="430" y="292" width="340" height="52" rx="6" class="field"/>
  <text x="448" y="325" class="muted" font-size="16">Benutzername eingeben</text>

  <text x="430" y="390" class="label">Passwort</text>
  <rect x="430" y="407" width="340" height="52" rx="6" class="field"/>
  <text x="448" y="440" class="muted" font-size="20">••••••••</text>

  <rect x="430" y="478" width="340" height="58" rx="6" fill="#f8d7da" stroke="#f1aeb5"/>
  <text x="448" y="503" fill="#842029" font-size="14" font-weight="700">Anmeldung fehlgeschlagen</text>
  <text x="448" y="524" fill="#842029" font-size="13">Benutzername oder Passwort ist falsch.</text>

  <rect x="430" y="552" width="340" height="52" rx="6" class="primary"/>
  <text x="600" y="585" class="button-text">Anmelden</text>

  <line x1="430" y1="628" x2="770" y2="628" stroke="#dee2e6" stroke-width="2"/>
  <text x="600" y="661" class="muted" font-size="16" text-anchor="middle">Noch kein Benutzerkonto?</text>
  <rect x="430" y="678" width="340" height="45" rx="6" class="secondary"/>
  <text x="600" y="707" class="button-text">Registrieren</text>
</svg>
