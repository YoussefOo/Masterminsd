{{> header title="WebSocket Inspector"}}

<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-8">
      <h1 class="h2 mb-1">WebSocket Inspector</h1>

      <p class="text-body-secondary mb-4">
        Verbinde dich mit einem WebSocket und beobachte eingehende Nachrichten.<br>
        <a
          href="#"
          data-bs-toggle="modal"
          data-bs-target="#todoWebSocketExampleModal"
        >
          Beispiel für den Ablauf von Todo erstellen.
        </a>
      </p>

      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-4">
          <form id="ws-form" class="row g-3">
            <div class="col-12 col-md">
              <label for="ws-path" class="form-label fw-semibold">
                WebSocket Path
              </label>

              <input
                id="ws-path"
                class="form-control"
                type="text"
                value="/ws/todos"
                placeholder="/ws/todos"
                required
              />
            </div>

            <div class="col-12 col-md-auto d-flex align-items-end gap-2">
              <button id="connect-button" class="btn btn-primary" type="submit">
                Verbinden
              </button>

              <button
                id="disconnect-button"
                class="btn btn-outline-secondary"
                type="button"
                disabled
              >
                Trennen
              </button>
            </div>
          </form>

          <div class="mt-3">
            <span id="status-badge" class="badge text-bg-secondary">
              Nicht verbunden
            </span>
          </div>

          <div
            id="ws-error"
            class="alert alert-danger mt-3 mb-0"
            role="alert"
            hidden
          ></div>
        </div>
      </div>

      <div class="card border-0 shadow-sm">
        <div class="card-header bg-body d-flex justify-content-between align-items-center py-3">
          <h2 class="h5 mb-0">Nachrichten-Log</h2>

          <button
            id="clear-log-button"
            class="btn btn-outline-danger btn-sm"
            type="button"
          >
            Log leeren
          </button>
        </div>

        <div class="card-body p-0">
          <div
            id="ws-log"
            class="font-monospace small p-3 bg-dark text-light rounded-bottom overflow-auto"
            style="min-height: 320px; max-height: 520px;"
          ></div>
        </div>
      </div>
    </div>
  </div>
</main>

<div
  class="modal fade"
  id="todoWebSocketExampleModal"
  tabindex="-1"
  aria-labelledby="todoWebSocketExampleModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2
          class="modal-title fs-5"
          id="todoWebSocketExampleModalLabel"
        >
          Todo erstellen: WebSocket, EventBus und Datenbank
        </h2>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Schließen"
        ></button>
      </div>

      <div class="modal-body text-center">
        <img
          src="/assets/todo-websocket-api.svg"
          class="img-fluid"
          alt="Sequenzdiagramm zum Erstellen eines Todos über WebSocket"
        />
      </div>
    </div>
  </div>
</div>

<script type="module" src="/src/ws-inspect.ts"></script>

{{> footer}}
