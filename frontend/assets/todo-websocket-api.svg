<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="720" viewBox="0 0 1250 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#181818"/>
    </marker>
    <style>
      text {
        fill: #000;
        font-family: sans-serif;
      }

      .title {
        font-size: 16px;
        font-weight: 700;
      }

      .group-title {
        font-size: 13px;
        font-weight: 700;
      }

      .participant {
        fill: #e2e2f0;
        stroke: #181818;
        stroke-width: 0.5;
      }

      .participant-text {
        font-size: 13px;
        text-anchor: middle;
      }

      .lifeline {
        stroke: #181818;
        stroke-width: 0.5;
        stroke-dasharray: 5 5;
      }

      .message {
        stroke: #181818;
        stroke-width: 1;
        marker-end: url(#arrow);
      }

      .response {
        stroke: #181818;
        stroke-width: 1;
        stroke-dasharray: 3 3;
        marker-end: url(#arrow);
      }

      .message-text {
        font-size: 12px;
      }

      .note {
        fill: #fff7d6;
        stroke: #181818;
        stroke-width: 0.5;
      }

      .note-text {
        font-size: 12px;
      }
    </style>
  </defs>

  <rect width="1250" height="720" fill="#fff"/>
  <text class="title" x="625" y="27" text-anchor="middle">
    WebSocket-Zusammenspiel: Todo erstellen und Änderung verteilen
  </text>

  <rect x="340" y="45" width="890" height="650" fill="#ddd" stroke="#181818" stroke-width="0.5"/>
  <text class="group-title" x="785" y="62" text-anchor="middle">Vert.x Backend</text>

  <!-- Participants -->
  <g>
    <rect class="participant" x="25" y="88" width="150" height="45" rx="3"/>
    <text class="participant-text" x="100" y="107">Frontend</text>
    <text class="participant-text" x="100" y="124">(sendender Client)</text>

    <rect class="participant" x="195" y="88" width="130" height="45" rx="3"/>
    <text class="participant-text" x="260" y="107">Weiterer</text>
    <text class="participant-text" x="260" y="124">WebSocket-Client</text>

    <rect class="participant" x="360" y="88" width="180" height="45" rx="3"/>
    <text class="participant-text" x="450" y="107">TodoWebSocketController</text>
    <text class="participant-text" x="450" y="124">/ws/todos</text>

    <rect class="participant" x="590" y="96" width="120" height="37" rx="3"/>
    <text class="participant-text" x="650" y="119">TodoService</text>

    <rect class="participant" x="755" y="96" width="140" height="37" rx="3"/>
    <text class="participant-text" x="825" y="119">TodoRepository</text>

    <rect class="participant" x="940" y="96" width="100" height="37" rx="3"/>
    <text class="participant-text" x="990" y="119">MariaDB</text>

    <rect class="participant" x="1080" y="96" width="125" height="37" rx="3"/>
    <text class="participant-text" x="1142.5" y="119">Vert.x EventBus</text>
  </g>

  <!-- Lifelines -->
  <g>
    <line class="lifeline" x1="100" y1="133" x2="100" y2="680"/>
    <line class="lifeline" x1="260" y1="133" x2="260" y2="680"/>
    <line class="lifeline" x1="450" y1="133" x2="450" y2="680"/>
    <line class="lifeline" x1="650" y1="133" x2="650" y2="680"/>
    <line class="lifeline" x1="825" y1="133" x2="825" y2="680"/>
    <line class="lifeline" x1="990" y1="133" x2="990" y2="680"/>
    <line class="lifeline" x1="1142.5" y1="133" x2="1142.5" y2="680"/>
  </g>

  <!-- Command and persistence -->
  <line class="message" x1="100" y1="180" x2="450" y2="180"/>
  <text class="message-text" x="112" y="159">create-Kommando</text>
  <text class="message-text" x="112" y="175">{ requestId: "1", payload: { text: "Einkaufen" } }</text>

  <line class="message" x1="450" y1="225" x2="650" y2="225"/>
  <text class="message-text" x="465" y="218">create("Einkaufen")</text>

  <line class="message" x1="650" y1="270" x2="825" y2="270"/>
  <text class="message-text" x="665" y="263">create("Einkaufen")</text>

  <line class="message" x1="825" y1="315" x2="990" y2="315"/>
  <text class="message-text" x="840" y="308">INSERT INTO todos (...)</text>

  <line class="response" x1="990" y1="355" x2="825" y2="355"/>
  <text class="message-text" x="840" y="348">Neues Todo</text>

  <line class="response" x1="825" y1="395" x2="650" y2="395"/>
  <text class="message-text" x="670" y="388">Todo</text>

  <!-- Event and direct response -->
  <line class="message" x1="650" y1="440" x2="1142.5" y2="440"/>
  <text class="message-text" x="670" y="433">publish("todos", Ereignis "created")</text>

  <line class="response" x1="650" y1="480" x2="450" y2="480"/>
  <text class="message-text" x="500" y="473">Todo</text>

  <line class="response" x1="450" y1="525" x2="100" y2="525"/>
  <text class="message-text" x="112" y="504">Direkte Antwort nur an den sendenden Client</text>
  <text class="message-text" x="112" y="519">{ type: "response", requestId: "1", payload: Todo }</text>

  <line class="message" x1="1142.5" y1="570" x2="450" y2="570"/>
  <text class="message-text" x="720" y="563">Ereignis "created"</text>

  <line class="message" x1="450" y1="615" x2="100" y2="615"/>
  <text class="message-text" x="112" y="608">Broadcast: { type: "created", payload: Todo }</text>

  <line class="message" x1="450" y1="655" x2="260" y2="655"/>
  <text class="message-text" x="270" y="648">Broadcast: "created"</text>

  <rect class="note" x="735" y="590" width="475" height="66" rx="3"/>
  <text class="note-text" x="750" y="612">Broadcast-Ereignisse werden an alle verbundenen Clients gesendet.</text>
  <text class="note-text" x="750" y="631">Sie enthalten keine requestId, weil sie keiner einzelnen Anfrage</text>
  <text class="note-text" x="750" y="648">zugeordnet sind.</text>
</svg>
